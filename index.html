  <script type="module">
  import { supabase } from './js/supabase.js';
  const { data } = await supabase.auth.getSession();
  if (!data.session) {
    location.href = 'auth.html';
  } else {
    console.log('مسجل الدخول باسم:', data.session.user.email);
    // اعرض الإيميل في الهيدر لو فيه مكان
    setTimeout(() => {
      const header = document.querySelector('header') || document.body;
      const div = document.createElement('div');
      div.style.cssText = 'text-align:center;padding:6px;background:#052e16;color:#86efac;font-size:13px';
      div.textContent = 'مسجل الدخول باسم: ' + data.session.user.email + ' | ';
      const btn = document.createElement('button');
      btn.textContent = 'تسجيل خروج';
      btn.style.cssText = 'background:#ef4444;color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;margin-right:8px';
      btn.onclick = async () => { await supabase.auth.signOut(); location.href='auth.html'; };
      div.appendChild(btn);
      document.body.prepend(div);
    }, 500);
  }
</script>
  <script type="module">
  import { migrateFromLocalStorage } from './js/migrate.js';
  try {
    const res = await migrateFromLocalStorage();
    if (res.startsWith('done')) {
      console.info('تم حفظ نسخة احتياطية من بيانات الجهاز في Supabase.');
    } else if (!['already', 'no-user', 'no-data'].includes(res)) {
      console.warn('لم تكتمل عملية نقل البيانات:', res);
    }
  } catch (error) {
    console.error('تعذر حفظ نسخة البيانات المحلية:', error);
  }
</script>
<body>
<div id="app">
  <div id="sb-overlay" onclick="closeSB()"></div>
  <aside id="sb"></aside>
  <div id="cn">
    <div id="top">
      <button id="bg" onclick="$g('#sb').classList.toggle('open'); document.getElementById('sb-overlay').style.display=$g('#sb').classList.contains('open')?'block':'none'">☰</button>
      <button onclick="bkw(-1)" title="رجوع">▶</button>
      <button onclick="bkw(1)" title="تقدم">◀</button>
      <h1 id="ttl"></h1>
      <span id="net" onclick="syncPage()"></span>
      <select id="who" onchange="swho(this.value)"></select>
      <select id="thb" onchange="togTheme(this.value)"><option value="">🎨</option><option value="light">فاتح</option><option value="dark">داكن</option><option value="auto">تلقائي</option></select>
      <button id="lgb" onclick="togLang()">🌐</button>
    </div>
    <div id="tabs"></div>
    <main id="m"></main>
  </div>
</div>
<div id="toast"></div>
<div id="pr" style="display:none"></div>
<script src="./js/app.js"></script>
<!-- Cloud Sync - Dynamic Loader - متحاولش تعدله تاني، كل التعديلات في js/cloud-sync.js بس -->
<script>
  (function(){
    var s = document.createElement('script');
    s.type = 'module';
    s.src = 'js/cloud-sync.js?v=' + Date.now();
    document.head.appendChild(s);
  })();
</script>
<script>
// إصلاح إغلاق القائمة - لا يغير الشكل
(function(){
  const origClose = window.closeSB;
  window.closeSB = function(){
    try{
      const sb=document.getElementById('sb');
      const ov=document.getElementById('sb-overlay');
      if(sb) sb.classList.remove('open');
      if(ov) ov.style.display='none';
      document.body.style.overflow='';
    }catch(e){}
  };
  const origOpen = window.openSB || function(){ document.getElementById('sb').classList.add('open'); };
  window.openSB = function(){
    try{
      document.getElementById('sb').classList.add('open');
      document.getElementById('sb-overlay').style.display='block';
      document.body.style.overflow='hidden';
    }catch(e){}
  };
})();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
