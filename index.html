<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<title>مدير المصنع</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<link rel="stylesheet" href="./css/style.css">
<style id="pgst"></style>
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
  <style>html{visibility:hidden}</style>
</head>
<script type="module">
import { supabase } from './js/supabase.js';
window.__factoryBootstrapReady = (async function bootstrapFactoryApp() {
    try {
      const { data, error } = supabase ? await supabase.auth.getSession() : { data: { session: null }, error: new Error('Supabase unavailable') };
      if (!data?.session || (error && navigator.onLine)) { location.replace('auth.html'); return false; }
      else {
        const { data: profile, error: profileError } = await supabase.from('profiles')
          .select('id,created_by,is_admin,permissions,must_change_password,username,full_name')
          .eq('id', data.session.user.id).maybeSingle();
        if (profileError || !profile) {
          // Offline use is allowed only for a profile previously verified online on this device.
          let cachedProfile = null;
          if (!navigator.onLine) {
            try { cachedProfile = JSON.parse(localStorage.getItem('factory-profile:' + data.session.user.id) || 'null'); } catch (_) {}
          }
          if (cachedProfile && cachedProfile.id === data.session.user.id) {
            if (cachedProfile.must_change_password === true && cachedProfile.is_admin !== true) {
              location.replace('change-password.html');
              return false;
            }
            window.__factoryAuthProfile = cachedProfile;
            window.__factoryAuthEmail = data.session.user.email || '';
            window.__factoryOfflineMode = true;
            document.documentElement.style.visibility = 'visible';
            if (typeof window.setFactoryAuthProfile === 'function') window.setFactoryAuthProfile(cachedProfile);
            return true;
          } else if (navigator.onLine) {
            await supabase.auth.signOut();
            location.replace('auth.html');
            return false;
          } else {
            document.documentElement.style.visibility = 'visible';
            document.body?.insertAdjacentHTML?.('afterbegin', '<div role="alert" style="padding:12px;background:#fee2e2;color:#991b1b;text-align:center">لا يوجد ملف حساب محفوظ على هذا الجهاز. اتصل بالإنترنت وسجّل الدخول مرة واحدة لتفعيل العمل دون اتصال.</div>');
            location.replace('auth.html');
            return false;
          }
        } else {
          if (profile.must_change_password === true && profile.is_admin !== true) {
            window.__factoryAuthProfile = profile;
            try { localStorage.setItem('factory-profile:' + data.session.user.id, JSON.stringify(profile)); } catch (_) {}
            location.replace('change-password.html');
            return false;
          }
          window.__factoryAuthProfile = profile;
          window.__factoryAuthEmail = data.session.user.email || '';
          window.__factoryOfflineMode = false;
          try { localStorage.setItem('factory-profile:' + data.session.user.id, JSON.stringify(profile)); } catch (_) {}
          document.documentElement.style.visibility = 'visible';
          if (typeof window.setFactoryAuthProfile === 'function') window.setFactoryAuthProfile(profile);
          return true;
        }
      }
    } catch (e) {
      console.error('Authentication bootstrap failed:', e);
      location.replace('auth.html');
      return false;
    }
  
})();
</script>
<body>
<div id="app">
  <div id="sb-overlay" onclick="closeSB()"></div>
  <aside id="sb"></aside>
  <div id="cn">
    <div id="top">
      <button id="bg" onclick="$g('#sb').classList.toggle('open'); document.getElementById('sb-overlay').style.display=$g('#sb').classList.contains('open')?'block':'none'">☰</button>
      <button onclick="bkw(-1)" title="رجوع">▶</button>
      <button onclick="bkw(1)" title="تقدم">◀</button>
      <h1 id="ttl"></h1>
      <span id="net" onclick="syncPage()" role="button" tabindex="0" aria-live="polite" title="حالة الاتصال والمزامنة"><span id="net-status">🟢 متصل</span><span id="sync-icon" class="sync-icon" aria-label="المزامنة التلقائية" title="المزامنة التلقائية">↻</span></span>
      <select id="who" onchange="swho(this.value)" aria-label="الحساب"></select>
      <button id="thb" type="button" onclick="togTheme()" aria-label="تغيير المظهر" title="تغيير المظهر">🌙</button>
    </div>
    <div id="tabs"></div>
    <main id="m"></main>
  </div>
</div>
<div id="toast"></div>
<div id="pr" style="display:none"></div>
<script type="module">
import appSource from './js/app.js?raw';

// Authentication and profile permissions must finish before app.js reads local data.
const authenticated = await window.__factoryBootstrapReady;
if (!authenticated || !window.__factoryAuthProfile?.id) {
  if (!location.pathname.endsWith('/auth.html') && !location.pathname.endsWith('/change-password.html')) {
    location.replace('auth.html');
  }
  throw new Error('Factory application startup stopped: no verified profile.');
}

// Register and activate the worker before loading lazy modules, so their first
// successful online requests are cached for the next offline session.
if ('serviceWorker' in navigator) {
  try {
    await navigator.serviceWorker.register('./sw.js');
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) {
      await Promise.race([
        new Promise(resolve => navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true })),
        new Promise(resolve => setTimeout(resolve, 2500))
      ]);
    }
  } catch (error) {
    console.warn('Service worker registration failed:', error);
  }
}

const { scopeFactoryStorage } = await import('./js/account-storage.js');
scopeFactoryStorage(window.__factoryAuthProfile);

const script = document.createElement('script');
script.textContent = appSource;
document.body.appendChild(script);

await import('./js/cloud-sync.js');

// إصلاح إغلاق القائمة - لا يغير الشكل
(function(){
  window.closeSB = function(){
    try{
      const sb=document.getElementById('sb');
      const ov=document.getElementById('sb-overlay');
      if(sb) sb.classList.remove('open');
      if(ov) ov.style.display='none';
      document.body.style.overflow='';
    }catch(e){}
  };
  window.openSB = function(){
    try{
      document.getElementById('sb').classList.add('open');
      document.getElementById('sb-overlay').style.display='block';
      document.body.style.overflow='hidden';
    }catch(e){}
  };
})();
</script>
</body>
</html>
