<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<title>مدير المصنع</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<link rel="stylesheet" href="./css/style.css">
<style id="pgst"></style>
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
  <style>html{visibility:hidden}</style>
</head>
<script type="module">
import { supabase } from './js/supabase.js';
import { activateUserStorage } from './js/user-storage.js';
function loadClassicScript(src){return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=()=>reject(new Error('Could not load '+src));document.body.appendChild(script)})}
async function startFactoryApp(profile,email,offlineMode){
 window.__factoryAuthProfile=profile;window.__factoryAuthEmail=email||'';window.__factoryOfflineMode=offlineMode===true;activateUserStorage(profile);
 await loadClassicScript('./js/app.js');
 if(typeof window.setFactoryAuthProfile==='function')window.setFactoryAuthProfile(profile);
 try{await import('./js/cloud-sync.js')}catch(error){console.error('Cloud sync module could not start:',error);window.__factoryCloudSyncUnavailable=true}
 window.closeSB=function(){try{const sb=document.getElementById('sb'),ov=document.getElementById('sb-overlay');if(sb)sb.classList.remove('open');if(ov)ov.style.display='none';document.body.style.overflow=''}catch(_){}};
 window.openSB=function(){try{const sb=document.getElementById('sb'),ov=document.getElementById('sb-overlay');if(sb)sb.classList.add('open');if(ov)ov.style.display='block';document.body.style.overflow='hidden'}catch(_){}};
 if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
 document.documentElement.style.visibility='visible';
}
async function bootstrapFactoryApp(){
 try{
  const {data,error}=supabase?await supabase.auth.getSession():{data:{session:null},error:new Error('Supabase unavailable')};
  if(!data?.session||(error&&navigator.onLine)){location.replace('auth.html');return}
  const userId=data.session.user.id;
  const {data:profile,error:profileError}=await supabase.from('profiles').select('id,created_by,is_admin,permissions,must_change_password,username,full_name').eq('id',userId).maybeSingle();
  if(profileError||!profile){
   let cached=null;if(!navigator.onLine){try{cached=JSON.parse(localStorage.getItem('factory-profile:'+userId)||'null')}catch(_){}}
   if(cached&&cached.id===userId){if(cached.must_change_password===true&&cached.is_admin!==true){location.replace('change-password.html');return}await startFactoryApp(cached,data.session.user.email||'',true)}
   else if(navigator.onLine){await supabase.auth.signOut();location.replace('auth.html')}else location.replace('auth.html');
   return;
  }
  if(profile.must_change_password===true&&profile.is_admin!==true){try{localStorage.setItem('factory-profile:'+userId,JSON.stringify(profile))}catch(_){}location.replace('change-password.html');return}
  try{localStorage.setItem('factory-profile:'+userId,JSON.stringify(profile))}catch(_){}
  await startFactoryApp(profile,data.session.user.email||'',false);
 }catch(error){console.error('Authentication bootstrap failed:',error);location.replace('auth.html')}
}
await bootstrapFactoryApp();
</script>
<body>
<div id="app">
  <div id="sb-overlay" onclick="closeSB()"></div>
  <aside id="sb"></aside>
  <div id="cn">
    <div id="top">
      <button id="bg" onclick="$g('#sb').classList.toggle('open'); document.getElementById('sb-overlay').style.display=$g('#sb').classList.contains('open')?'block':'none'">☰</button>
      <button onclick="bkw(-1)" title="رجوع">▶</button>
      <button onclick="bkw(1)" title="تقدم">◀</button>
      <h1 id="ttl"></h1>
      <span id="net" onclick="syncPage()" role="button" tabindex="0" aria-live="polite" title="حالة الاتصال والمزامنة"><span id="net-status">🟢 متصل</span><span id="sync-icon" class="sync-icon" aria-label="المزامنة التلقائية" title="المزامنة التلقائية">↻</span></span>
      <select id="who" onchange="swho(this.value)" aria-label="الحساب"></select>
      <button id="thb" type="button" onclick="togTheme()" aria-label="تغيير المظهر" title="تغيير المظهر">🌙</button>
    </div>
    <div id="tabs"></div>
    <main id="m"></main>
  </div>
</div>
<div id="toast"></div>
<div id="pr" style="display:none"></div>



</body>
</html>
