<script>
(function(){
  function showFactoryBootError(title, detail) {
    try {
      document.documentElement.style.visibility = 'visible';
      const render = function() {
        if (!document.body || document.getElementById('factory-boot-error')) return;
        const box = document.createElement('section');
        box.id = 'factory-boot-error';
        box.setAttribute('role', 'alert');
        box.style.cssText = 'position:fixed;z-index:2147483647;inset:12px;overflow:auto;background:#fff7ed;color:#7c2d12;border:2px solid #c2410c;border-radius:12px;padding:20px;font:16px/1.7 Arial,sans-serif;direction:rtl;text-align:right;box-shadow:0 8px 30px #0003';
        const safe = String(detail || 'خطأ غير محدد').replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});
        box.innerHTML = '<h2 style="margin-top:0">' + title + '</h2><p>تم إيقاف تحميل الشاشة لحماية بياناتك. لم يتم حذف الحساب أو تغيير صلاحياته.</p><pre style="white-space:pre-wrap;word-break:break-word;background:#ffedd5;padding:10px;border-radius:8px">' + safe + '</pre><button id="factory-boot-retry" style="padding:10px 18px;margin-left:8px">إعادة المحاولة</button><a href="auth.html">العودة لتسجيل الدخول</a>';
        document.body.appendChild(box);
        document.getElementById('factory-boot-retry').onclick = function(){ location.reload(); };
      };
      if (document.body) render();
      else document.addEventListener('DOMContentLoaded', render, {once:true});
      console.error('[Factory bootstrap diagnostic]', title, detail);
    } catch (diagnosticError) {
      document.documentElement.style.visibility = 'visible';
      console.error('Could not render bootstrap diagnostic', diagnosticError);
    }
  }
  window.__showFactoryBootError = showFactoryBootError;
  window.addEventListener('error', function(event) {
    showFactoryBootError('حدث خطأ أثناء تشغيل البرنامج', event.message || event.error?.message || 'JavaScript error');
  });
  window.addEventListener('unhandledrejection', function(event) {
    const reason = event.reason;
    showFactoryBootError('تعذر إكمال تهيئة البرنامج', reason?.message || String(reason || 'Unhandled promise rejection'));
  });
})();
</script>
</head>
<script type="module">
import { supabase } from './js/supabase.js';
import { retryStartup } from './js/startup-retry.mjs';
import { scopeFactoryStorage } from './js/account-storage.js';
window.__factoryAuthReady = false;
window.__factoryAuthPromise = (async function bootstrapFactoryApp() {
  const profileKey = id => 'factory-profile:' + id;
  const showProfile = (profile, user, offline) => {
    if (!profile || profile.id !== user.id) throw new Error('ملف الحساب لا يطابق المستخدم الحالي');
    if (profile.must_change_password === true && profile.is_admin !== true) {
      try { localStorage.setItem(profileKey(user.id), JSON.stringify(profile)); } catch (_) {}
      location.replace('change-password.html');
      return false;
    }
    try { scopeFactoryStorage(profile); } catch (error) { console.warn('Account storage scoping skipped:', error); }
    window.__factoryAuthProfile = profile;
    window.__factoryAuthEmail = user.email || '';
    window.__factoryOfflineMode = !!offline;
    document.documentElement.style.visibility = 'visible';
    if (typeof window.setFactoryAuthProfile === 'function') window.setFactoryAuthProfile(profile);
    return true;
  };
  const fetchProfile = async id => {
    let query = supabase.from('profiles').select('id,created_by,is_admin,permissions,must_change_password,username,full_name').eq('id', id).maybeSingle();
    if (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) query = query.abortSignal(AbortSignal.timeout(9000));
    const result = await query;
    if (result.error) throw result.error;
    if (!result.data) throw new Error('لم يتم العثور على ملف الحساب المرتبط بالمستخدم');
    return result.data;
  };
  try {
    if (!supabase) throw new Error('إعداد الاتصال بقاعدة بيانات الإنتاج غير متاح');
    const { data } = await retryStartup(async () => {
      if (!navigator.onLine) { const offlineError = new Error('الاتصال بالإنترنت مطلوب للوصول إلى قاعدة البيانات.'); offlineError.code = 'OFFLINE'; throw offlineError; }
      const result = await supabase.auth.getSession();
      if (result.error) throw result.error;
      return result;
    });
    const session = data?.session;
    if (!session?.user) {
      location.replace('auth.html');
      return;
    }
    const user = session.user;
    const profile = await retryStartup(() => fetchProfile(user.id));
    localStorage.setItem(profileKey(user.id), JSON.stringify(profile));
    if (showProfile(profile, user, false)) window.__factoryAuthReady = true;
  } catch (error) {
    console.error('Authentication bootstrap failed:', error);
    window.__showFactoryBootError?.('تعذر التحقق من حسابك على قاعدة بيانات الإنتاج', error?.message || String(error));
  }
})();
</script>

<script>

// إصلاح إغلاق القائمة - لا يغير الشكل
(function(){
  const origClose = window.closeSB;
  window.closeSB = function(){
    try{
      const sb=document.getElementById('sb');
      const ov=document.getElementById('sb-overlay');
      if(sb) sb.classList.remove('open');
      if(ov) ov.style.display='none';
      document.body.style.overflow='';
    }catch(e){}
  };
  const origOpen = window.openSB || function(){ document.getElementById('sb').classList.add('open'); };
  window.openSB = function(){
    try{
      document.getElementById('sb').classList.add('open');
      document.getElementById('sb-overlay').style.display='block';
      document.body.style.overflow='hidden';
    }catch(e){}
  };
})();
window.addEventListener('factory-database-ready',()=>{if(window.__factoryAuthReady!==true||!window.__factoryAuthProfile||window.__factoryOfflineMode===true){document.getElementById('factory-boot-screen')?.remove();window.__showFactoryBootError?.('تعذر التحقق من جلسة الحساب','يلزم التحقق المباشر من الحساب وقاعدة بيانات الإنتاج قبل فتح البرنامج.');return}document.getElementById('app').style.visibility='visible';document.getElementById('factory-boot-screen')?.classList.add('done');setTimeout(()=>document.getElementById('factory-boot-screen')?.remove(),180)});
window.addEventListener('factory-db-startup-error',e=>{document.getElementById('factory-boot-screen')?.remove();window.__showFactoryBootError?.('تعذر الاتصال بقاعدة بيانات الإنتاج',e.detail?.message||'تحقق من الاتصال ثم أعد المحاولة')});
setTimeout(()=>{const s=document.getElementById('factory-boot-screen');if(s&&!window.__factoryDatabaseFirstReady){s.remove();window.__showFactoryBootError?.('تأخر تحميل بيانات الشركة','لم تكتمل قراءة قاعدة البيانات بعد 45 ثانية. تحقق من الاتصال ثم أعد المحاولة.')}},45000);
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
