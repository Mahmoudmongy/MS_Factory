<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول - مدير المصنع</title>
<link rel="stylesheet" href="./css/style.css">
<style>
  .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .auth-card{width:100%;max-width:380px;padding:24px}
  .auth-card h1{margin:0 0 8px;font-size:22px}
  .auth-form{display:flex;flex-direction:column}
  .remember-row{display:flex;align-items:center;gap:8px;margin:12px 0}.remember-row input{width:auto}
</style>
</head>
<body>
<main class="auth-page">
  <section class="card auth-card">
    <h1>مدير المصنع</h1>
    <p id="auth-status" class="mu"></p>
    <p id="auth-msg" class="mu" role="status"></p>

    <!-- استخدمنا div مش form عشان مفيش Refresh يحصل -->
    <div id="auth-form" class="auth-form">
      <label for="auth-email">البريد الإلكتروني</label>
      <input id="auth-email" type="email" dir="ltr" autocomplete="email">
      <label for="auth-password">كلمة المرور</label>
      <input id="auth-password" type="password" dir="ltr" autocomplete="current-password" minlength="6">
      <label class="remember-row"><input type="checkbox" id="auth-remember" checked> تذكرني على هذا المتصفح</label>
      <div class="row">
        <button type="button" id="auth-login">تسجيل الدخول</button>
      </div>
    </div>

  </section>
</main>
<script type="module" src="./js/auth.js"></script>
</body>
</html>
