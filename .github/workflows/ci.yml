name: Factory Manager checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: factory-ci-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
