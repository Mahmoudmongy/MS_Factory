name: Factory Manager checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: factory-ci-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Validate Cloudflare Workers bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Validate pinned Supabase CLI backup flags without connecting to production
        run: |
          npx --yes supabase@3.0.0 db dump --help > supabase-dump-help.txt
          grep -q -- '--remote' supabase-dump-help.txt
          grep -q -- '--role-only' supabase-dump-help.txt
          grep -q -- '--data-only' supabase-dump-help.txt
          grep -q -- '--file' supabase-dump-help.txt
      - name: Parse application and recovery scripts
        run: |
          node --check js/app.js
          node --check --input-type=module < js/cloud-sync.js
          node --check --input-type=module < js/accounting-sync-core.js
          bash -n scripts/restore-supabase-from-backup.sh
          sh -n scripts/export-auth-and-counts.sh
      - run: npm test
