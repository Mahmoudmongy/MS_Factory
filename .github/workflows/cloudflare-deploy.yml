name: Deploy MS Factory to Cloudflare Workers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ms-factory-cloudflare-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run application regression tests
        run: npm test

      - name: Build production application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://yvrislcbbhtruwdnuooz.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_7y8sqUPYv4mCfmpjin3xRQ_1_X5QJfG

      - name: Verify required static assets
        shell: bash
        run: |
          set -euo pipefail
          echo "Built files:"
          find dist -maxdepth 4 -type f -printf '%p (%s bytes)\\n' | sort
          for file in dist/index.html dist/auth.html dist/change-password.html dist/js/app.js dist/sw.js; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required runtime asset is missing or empty: $file"
              exit 1
            fi
          done
          if ! grep -q 'manifest' dist/index.html; then
            echo "::error::PWA manifest reference is missing from the built application shell"
            exit 1
          fi

      - name: Deploy static application to Cloudflare Workers
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d6d9e923e57e3b039156162fc231617e
          command: deploy
