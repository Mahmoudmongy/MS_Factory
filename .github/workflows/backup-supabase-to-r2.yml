name: Encrypted Supabase database backup

on:
  schedule:
    - cron: "35 1 * * *"
  workflow_dispatch:
    inputs:
      run_confirmed:
        description: "Run a backup now (only after the private R2 bucket, retention rules and secrets are configured)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: encrypted-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main' && vars.BACKUP_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_confirmed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required configuration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_LOCK_TOKEN: ${{ secrets.CLOUDFLARE_R2_LOCK_TOKEN }}
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_URL AGE_RECIPIENT R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY CLOUDFLARE_R2_LOCK_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret/variable: $name"
              exit 1
            fi
          done

      - name: Verify immutable retention and lifecycle rules before backup
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          CLOUDFLARE_R2_LOCK_TOKEN: ${{ secrets.CLOUDFLARE_R2_LOCK_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          lock_url="https://api.cloudflare.com/client/v4/accounts/${R2_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/lock"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_R2_LOCK_TOKEN}" "$lock_url" -o r2-lock.json
          jq -e '.success == true and any(.result.rules[]?; .enabled == true and .prefix == "database/ms-factory/" and .condition.type == "Age" and .condition.maxAgeSeconds >= 7776000)' r2-lock.json >/dev/null
          export AWS_DEFAULT_REGION=auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api get-bucket-lifecycle-configuration --bucket "$R2_BUCKET" --endpoint-url "$endpoint" > r2-lifecycle.json
          jq -e 'any(.Rules[]?; .Status == "Enabled" and ((.Filter.Prefix // .Prefix // "") == "database/ms-factory/") and (.Expiration.Days // 0) >= 120)' r2-lifecycle.json >/dev/null

      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age

      - name: Export Supabase roles, schema and data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          npx --yes supabase@latest db dump --db-url "$SUPABASE_DB_URL" -f roles.sql --role-only
          npx --yes supabase@latest db dump --db-url "$SUPABASE_DB_URL" -f schema.sql
          npx --yes supabase@latest db dump --db-url "$SUPABASE_DB_URL" -f data.sql --use-copy --data-only
          # Supabase CLI deliberately excludes managed auth/storage schemas.
          # Export Auth users, identities and MFA recovery material; never export sessions/tokens.
          docker run --rm -v "$PWD:/backup" -e SUPABASE_DB_URL postgres:17-alpine sh -ec '
            pg_dump "$SUPABASE_DB_URL" --data-only --no-owner --no-privileges \
              --table=auth.users --table=auth.identities \
              --table=auth.mfa_factors --table=auth.mfa_recovery_code_sets \
              --table=auth.mfa_recovery_codes --table=auth.webauthn_credentials \
              --file=/backup/auth-users.sql
            psql "$SUPABASE_DB_URL" -Atqc "select count(*) from storage.buckets" > /backup/storage-bucket-count.txt
            psql "$SUPABASE_DB_URL" -Atqc "select count(*) from auth.users" > /backup/auth-user-count.txt
          '
          if [ "$(cat storage-bucket-count.txt)" != "0" ]; then
            echo "::error::Supabase Storage buckets exist; object bytes are not included. Configure and test a separate object backup before enabling database backups."
            exit 1
          fi
          cp supabase/restore/auth-trigger.sql auth-trigger.sql
          cp -a supabase/migrations backup-migrations
          cp -a supabase/functions backup-edge-functions
          test -s roles.sql
          test -s schema.sql
          test -s data.sql
          test -s auth-users.sql
          test -s auth-trigger.sql
          sha256sum roles.sql schema.sql data.sql auth-users.sql auth-trigger.sql > database-files.sha256
          cat > manifest.txt <<EOF
          project=ms-factory
          created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          source=Supabase CLI db dump
          includes=roles,schema,public-data,auth-users-identities-mfa-webauthn,auth-trigger,migrations,edge-functions
          storage_bucket_count=$(cat storage-bucket-count.txt)
          auth_user_count=$(cat auth-user-count.txt)
          encryption=age public-key recipient
          EOF
          tar -czf ms-factory-db-backup.tar.gz roles.sql schema.sql data.sql auth-users.sql auth-trigger.sql backup-migrations backup-edge-functions database-files.sha256 manifest.txt storage-bucket-count.txt auth-user-count.txt
          sha256sum ms-factory-db-backup.tar.gz > ms-factory-db-backup.tar.gz.sha256

      - name: Encrypt backup before upload
        env:
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          age --encrypt --recipient "$AGE_RECIPIENT" \
            --output ms-factory-db-backup.tar.gz.age ms-factory-db-backup.tar.gz
          test -s ms-factory-db-backup.tar.gz.age
          sha256sum ms-factory-db-backup.tar.gz.age > ms-factory-db-backup.tar.gz.age.sha256

      - name: Upload encrypted backup to private Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          export AWS_DEFAULT_REGION=auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          current_bytes="$(aws s3 ls "s3://${R2_BUCKET}/" --recursive --endpoint-url "$endpoint" | awk '$3 ~ /^[0-9]+$/ { total += $3 } END { print total + 0 }')"
          new_bytes="$(stat -c%s ms-factory-db-backup.tar.gz.age)"
          if [ "$((current_bytes + new_bytes))" -gt 9000000000 ]; then
            echo "::error::R2 backup storage would exceed the 9 GB safety ceiling for the 10 GB free allowance."
            exit 1
          fi
          stamp="$(date -u +%Y/%m/%d/%H%M%S)"
          key="database/ms-factory/${stamp}/ms-factory-db-backup.tar.gz.age"
          aws s3 cp ms-factory-db-backup.tar.gz.age "s3://${R2_BUCKET}/${key}" \
            --endpoint-url "$endpoint" --only-show-errors --no-progress
          aws s3api head-object --bucket "$R2_BUCKET" --key "$key" \
            --endpoint-url "$endpoint" > uploaded-object.json
          test -s uploaded-object.json
          aws s3 cp "s3://$R2_BUCKET/$key" "$RUNNER_TEMP/ms-factory-backup-readback.age" \
            --endpoint-url "$endpoint" --only-show-errors --no-progress
          cmp --silent ms-factory-db-backup.tar.gz.age "$RUNNER_TEMP/ms-factory-backup-readback.age"
          echo "Encrypted backup uploaded and read-back verified: s3://$R2_BUCKET/$key"
          echo "Encrypted archive SHA-256:"
          cat ms-factory-db-backup.tar.gz.age.sha256

      - name: Remove plaintext database exports
        if: always()
        run: |
          rm -rf roles.sql schema.sql data.sql auth-users.sql auth-trigger.sql backup-migrations backup-edge-functions manifest.txt storage-bucket-count.txt auth-user-count.txt r2-lock.json r2-lifecycle.json uploaded-object.json \
            ms-factory-db-backup.tar.gz ms-factory-db-backup.tar.gz.sha256
