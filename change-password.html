<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>تغيير كلمة المرور - مدير المصنع</title>
<link rel="stylesheet" href="./css/style.css">
<style>
  .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .auth-card{width:100%;max-width:420px;padding:24px}
  .auth-card h1{margin:0 0 8px;font-size:22px}
  .auth-form{display:flex;flex-direction:column;gap:8px}
  .auth-form button{margin-top:8px}
</style>
</head>
<body>
<main class="auth-page">
  <section class="card auth-card">
    <h1>تغيير كلمة المرور</h1>
    <p class="mu">هذه أول مرة تدخل فيها بحسابك. لازم تختار كلمة مرور جديدة قبل استخدام البرنامج.</p>
    <p id="cp-user" class="mu"></p>
    <p id="cp-message" class="mu" role="status" aria-live="polite"></p>
    <div id="cp-form" class="auth-form" hidden>
      <label for="cp-password">كلمة المرور الجديدة</label>
      <input id="cp-password" type="password" dir="ltr" autocomplete="new-password" minlength="10" maxlength="128">
      <label for="cp-confirm">تأكيد كلمة المرور</label>
      <input id="cp-confirm" type="password" dir="ltr" autocomplete="new-password" minlength="10" maxlength="128">
      <button id="cp-submit" type="button">حفظ كلمة المرور والدخول</button>
    </div>
    <button id="cp-logout" type="button" class="g">تسجيل الخروج</button>
  </section>
</main>
<script type="module" src="./js/change-password.js"></script>
</body>
</html>
